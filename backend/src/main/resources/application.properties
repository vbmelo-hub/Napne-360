spring.application.name=napne360-backend
server.port=9000
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/napne360?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:napne360}
spring.datasource.password=${DB_PASSWORD:napne360}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/napne360_documents}
spring.data.mongodb.auto-index-creation=true

napne360.security.jwt-secret=${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
napne360.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
napne360.storage.root=${STORAGE_ROOT:./data/uploads}
napne360.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
springdoc.swagger-ui.path=/swagger-ui.html
