services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: napne360
      MYSQL_USER: ${DB_USERNAME:-napne360}
      MYSQL_PASSWORD: ${DB_PASSWORD:-napne360}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-development-only}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root-development-only}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/napne360?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-napne360}
      DB_PASSWORD: ${DB_PASSWORD:-napne360}
      MONGODB_URI: mongodb://mongo:27017/napne360_documents
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-with-at-least-32-bytes}
      STORAGE_ROOT: /data/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      SEED_ENABLED: ${SEED_ENABLED:-true}
    ports:
      - "9000:9000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  mongo-data:
  uploads:
