services:
  app:
    image: mcr.microsoft.com/devcontainers/java:21
    command: sleep infinity
    volumes:
      - ..:/workspaces/Napne-360:cached
    environment:
      DB_URL: jdbc:mysql://mysql:3306/napne360?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: napne360
      DB_PASSWORD: napne360
      MONGODB_URI: mongodb://mongo:27017/napne360_documents
    depends_on:
      - mysql
      - mongo
    ports:
      - "9000:9000"
      - "4200:4200"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: napne360
      MYSQL_USER: napne360
      MYSQL_PASSWORD: napne360
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    ports:
      - "8080:80"

volumes:
  mysql-data:
  mongo-data:
