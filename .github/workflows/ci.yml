name: Verify NAPNE 360
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Maven backend
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -ntp clean verify
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Compile frontend
        working-directory: frontend
        run: npm run build
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --browsers=ChromeHeadless
      - name: Dependency security check
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Start integration databases
        run: docker compose up -d --wait mysql mongo
      - name: Start API with fictional seed
        run: |
          java -jar backend/target/napne360-backend-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:9000/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test role workflows
        working-directory: frontend
        run: npm run e2e
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            backend/target/surefire-reports
            frontend/test-results
            backend.log
